<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-6">
      <div class="card shadow-sm border-0 p-4">
        <h4 class="card-title fw-bold mb-2">Canje de Recompensa (Cortesía #11)</h4>
        <p class="text-muted small mb-4">
          Selecciona la bebida o pastel que el cliente eligió como regalo al completar sus 10 sellos.
        </p>

        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <form (ngSubmit)="onClaim()">
          <div class="mb-3">
            <label class="form-label fw-semibold">ID del Cliente</label>
            <input type="number" class="form-control" [(ngModel)]="customerId" name="customerId" required placeholder="Ej. 1">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Producto de Cortesía</label>
            <select class="form-select" [(ngModel)]="selectedProductId" name="selectedProductId" required>
              <option [ngValue]="null" disabled>Elige el producto gratis</option>
              <option *ngFor="let opt of rewardOptions" [ngValue]="opt.id_product">
                {{ opt.name }} ({{ opt.category_name }})
              </option>
            </select>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" [disabled]="!customerId || !selectedProductId">
            <i class="bi bi-gift me-2"></i>Entregar Recompensa
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
