<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card shadow-sm border-0 p-4">
        <h4 class="card-title fw-bold mb-2">Escanear QR de Cliente</h4>
        <p class="text-muted small mb-4">
          Valida la regla de seguridad de 12 horas por sello automáticamente.
        </p>

        <form (ngSubmit)="onScanSubmit()" class="mb-4">
          <div class="input-group">
            <input 
              type="text" 
              class="form-control" 
              [(ngModel)]="qrInput" 
              name="qrInput" 
              placeholder="Ingresa token o lee con escáner físico/cámara"
              required autofocus>
            <button class="btn btn-primary" type="submit" [disabled]="isProcessing">
              <span *ngIf="isProcessing" class="spinner-border spinner-border-sm me-1"></span>
              Registrar Sello
            </button>
          </div>
        </form>

        <!-- Mensaje de Rechazo (Regla de 12 horas) -->
        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          <i class="bi bi-clock-history me-2"></i>{{ errorMessage }}
        </div>

        <!-- Mensaje de Éxito -->
        <div *ngIf="scanResult" class="alert alert-success" role="alert">
          <h5 class="alert-heading h6 fw-bold mb-1">¡Sello Registrado!</h5>
          <p class="mb-1">{{ scanResult.message }}</p>
          <hr>
          <p class="mb-0 small">Sellos actuales: <strong>{{ scanResult.stamps_count }}/10</strong></p>
          <span *ngIf="scanResult.eligible_for_reward" class="badge bg-warning text-dark mt-2">
            ¡Completó 10 sellos! Recompensa disponible.
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
