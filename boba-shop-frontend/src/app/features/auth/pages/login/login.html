<div class="container my-5 py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-9 col-md-6 col-lg-4">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-primary"></i>
            <h2 class="h4 fw-bold mt-2">Iniciar Sesión</h2>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ errorMessage }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Usuario / Correo</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input 
                  type="email" 
                  id="email" 
                  class="form-control" 
                  formControlName="email" 
                  placeholder="usuario@boba.com"
                  [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
              </div>
            </div>

            <div class="mb-4">
              <label for="password_hash" class="form-label fw-semibold small">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input 
                  type="password" 
                  id="password_hash" 
                  class="form-control" 
                  formControlName="password_hash" 
                  placeholder="••••••••"
                  [class.is-invalid]="loginForm.get('password_hash')?.touched && loginForm.get('password_hash')?.invalid">
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary py-2 fw-semibold" [disabled]="loginForm.invalid || isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Validando...' : 'Entrar' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
