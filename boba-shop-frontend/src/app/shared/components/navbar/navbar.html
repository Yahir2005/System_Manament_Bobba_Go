<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary d-flex align-items-center" routerLink="/menu">
      <i class="bi bi-cup-straw me-2 fs-4"></i>Bobba Go!
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/menu" routerLinkActive="active">Menú</a>
        </li>
        <!-- Enlaces operativos (visibles si hay sesión) -->
        <ng-container *ngIf="currentUser">
          <li class="nav-item">
            <a class="nav-link" routerLink="/products" routerLinkActive="active">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/loyalty/scan" routerLinkActive="active">Escanear QR</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/rewards/claim" routerLinkActive="active">Canjes</a>
          </li>
          <!-- Enlaces exclusivos de Administrador -->
          <li class="nav-item" *ngIf="currentUser?.role?.name === 'administrator'">
            <a class="nav-link text-warning fw-semibold" routerLink="/products/approvals" routerLinkActive="active">
              <i class="bi bi-shield-check me-1"></i>Aprobaciones
            </a>
          </li>
          <li class="nav-item" *ngIf="currentUser?.role?.name === 'administrator'">
            <a class="nav-link text-info fw-semibold" routerLink="/categories/new" routerLinkActive="active">
              <i class="bi bi-tags me-1"></i>Categorías
            </a>
          </li>
        </ng-container>
      </ul>

      <!-- Botón de acceso / cierre de sesión -->
      <div class="d-flex align-items-center gap-3">
        <div *ngIf="!currentUser">
          <a routerLink="/auth/login" class="btn btn-outline-light btn-sm">Acceso Personal</a>
        </div>
        <div *ngIf="currentUser" class="d-flex align-items-center gap-2 text-light">
          <i class="bi bi-person-circle fs-5 text-primary"></i>
          <span class="small">{{ currentUser?.name }} ({{ currentUser?.role?.name || 'Empleado' }})</span>
          <button (click)="logout()" class="btn btn-outline-danger btn-sm ms-2">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
